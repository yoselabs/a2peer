[project]
name = "a2peer"
version = "0.1.0"
description = "Consult other agents (Grok Build, Codex CLI, Claude Code) as advisors from one agent session, over MCP"
readme = "README.md"
authors = [
    { name = "Denis Tomilin", email = "dt0xff@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
a2peer = "a2peer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
select = [
    # correctness & the core
    "F",    # pyflakes — real bugs (undefined names, unused imports)
    "E", "W",  # pycodestyle
    "PLC", "PLE", "PLR", "PLW",  # pylint — the useful quarter of it
    "B",    # bugbear — likely-wrong constructs
    "BLE",  # no blind `except:` / `except Exception` swallowing
    "TRY",  # tryceratops — exception antipatterns
    "RSE",  # raise — no needless parens on re-raise
    "EM",   # exception messages assigned to a var (clean tracebacks)
    "RET",  # return-branch hygiene
    "SIM",  # simplifiable constructs
    "C4",   # comprehension quality
    "C90",  # mccabe — cyclomatic complexity ceiling
    "PIE",  # misc lints
    "FURB", # refurb — modernizations
    "FLY",  # f-string over str.join
    # typing & annotations
    "ANN",  # full annotation enforcement — everything typed
    "UP",   # pyupgrade — modern syntax for the target version
    "FA",   # future annotations where needed
    "TC",   # type-checking-only imports go under TYPE_CHECKING
    "PYI",  # stub/typing hygiene
    # imports & structure
    "I",    # isort
    "TID",  # tidy-imports (no relative parent imports)
    "ICN",  # import-convention (np, pd, …)
    "INP",  # no implicit-namespace packages (missing __init__)
    "A",    # flake8-builtins — the builtin-named-concept convention
    "N",    # pep8-naming
    "SLF",  # no private-member access across boundaries
    # safety & correctness of effects
    "S",    # bandit — security (subprocess, eval, tmp, etc.)
    "DTZ",  # timezone-aware datetimes only
    "LOG", "G",  # logging done right (no f-strings in log calls)
    "T10",  # no leftover breakpoint()/pdb
    "T20",  # no stray print() in library code
    "ASYNC",# async pitfalls
    "PTH",  # pathlib over os.path
    "FBT",  # no boolean-trap positional args
    "ISC",  # implicit string concat (ISC001 off — formatter owns it)
    # docs & rot
    # `D` (pydocstyle) is deliberately absent. Docstrings are written where they carry
    # a decision — why this exists, what breaks without it — not on every public name.
    # The full google convention would have a2kay writing 379 of them, 110 of those on
    # methods whose signature already says everything. Denis's call, 2026-09-12. The
    # docstrings already written here stay; they just stop being mandatory.
    "ERA",  # no commented-out code (leave it smaller, constitution III/VIII)
    "ARG",  # no unused arguments
    "PERF", # obvious performance footguns
    "RUF",  # ruff's own rules (RUF100 catches stale noqa)
]
ignore = [
    "ANN401",  # allow `Any` in genuinely-variadic *args/**kwargs
    "PLR0913", # arg count — deep functions legitimately take many args
    "PLR2004", # magic values — too noisy at this scale; revisit if it bites
    "ISC001",  # single-line implicit concat — the formatter owns this; would conflict
    "TRY003",  # long messages in raise — EM handles the real concern; TRY003 over-fires
    "S603",    # subprocess call w/ shell=False — the whole point of git-porcelain; audited by design
    # S607 partial path: `git-porcelain` shells out to `git` BY NAME on purpose, and
    # hardcoding `/usr/bin/git` is wrong on any machine that is not this one. Global
    # rather than per-file so a consumer that shells out from `src/` inherits the same
    # answer instead of rediscovering it.
    "S607",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-builtins]
# our modules are named for the concept they own; that is the convention, not a clash.
builtins-allowed-modules = ["types"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so a model's imports must NOT move
# behind `TYPE_CHECKING`. Found in a2kay: `TC --fix` moved them and every model failed
# to build. Five packages here declare pydantic, so this repo is exposed the same way.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# One relaxation list, shared with every consumer (a2kay carries the same one under its
# own `tests/**`). A test asserts, uses magic numbers and fake tokens, binds a boolean
# positionally, reaches into the private of the thing it tests, and prints its report —
# all of that is what a test is for.
"tests/**" = ["ANN", "ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0915", "PYI034", "TRY300", "TRY301", "FBT001", "SLF", "INP", "T201"]
"packages/*/tests/**" = ["ANN", "ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0915", "PYI034", "TRY300", "TRY301", "FBT001", "SLF", "INP", "T201", "FBT"]
# the boundary fitness test walks the tree; it needs paths + prints.
"tests/lib/**" = ["ANN", "T20", "S101"]
# tools are CLI scripts: printing is their job, `git`/`opa` on PATH is deliberate,
# and a module docstring is enough (no per-function D).
"tools/**" = ["T201"]
# package benches (convert-md's engine-comparison harnesses, D4): throwaway CLI
# probe scripts + fixture generators, not shipped library code — same shape as
# tools/**, plus INP001 (deliberately not a package), PLC0415 (isolated engines
# import lazily by design), full D (docstrings not policed in throwaway code, as
# in tests), and SLF (the docx fixture generator does low-level oxml surgery).
"packages/*/bench/**" = ["T201", "INP001", "PLC0415", "SLF"]
# any-browser's two engine adapters are DEFINED by "render never raises for a
# routine failure" (the base.py BrowserBackend contract): every driver / CDP /
# telemetry quirk is caught and turned into a RenderOutcome or a best-effort
# no-op, so a broad `except Exception` is the design, not a swallowed bug. Scoped
# to exactly the two driver modules — the seam (base.py) and launchers raise no
# such thing.
"packages/any-browser/src/any_browser/playwright.py" = ["BLE001"]
"packages/any-browser/src/any_browser/zendriver.py" = ["BLE001"]

[tool.codespell]
# bench/corpus (source PDFs, binary) + bench/outputs (raw engine output, incl.
# scanned-page OCR text) are generated/fixture data, not authored content —
# real typos there are the engines' problem, not this repo's.
#
# tests/fixtures/*.html likewise: those are pages CAPTURED VERBATIM from live
# sites. Editing one to satisfy a spellchecker would make it a hand-written
# approximation — the precise defect dom-schema exists to prevent — so the
# fixture is authoritative and the linter yields to it, never the reverse.
skip = "uv.lock,.venv,.git,*.pyc,.ruff_cache,.pytest_cache,docs/thoughts/*,packages/*/bench/corpus/*,packages/*/bench/outputs/*,packages/*/tests/fixtures/*.html"
# doctrine/glossary coinages the dictionary flags but we mean on purpose.
ignore-words-list = "wins,ontology,noqa,crate,ba,te,alls"
check-filenames = ""

# deptry is configured PER PACKAGE (it reads each package's own pyproject when run
# from that dir) and invoked via `make deps` with `--known-first-party`. No root
# [tool.deptry] block: it would never be read from the package working directory.

# ── coverage — measured on every `make test`; floor enforced (no silent rot) ───
[tool.coverage.run]
branch = true
source = ["src/a2peer"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # protocol/abstract stubs
]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-bdd>=8,<9",         # Gherkin scenarios: how shelf projects state their tests
    "pytest-cov>=6,<8",         # coverage measurement + floor
    "pytest-asyncio>=0.24,<1",  # async tests (the MCP server is async)
    "ruff>=0.7,<1",             # lint + format
    "pyrefly>=1.3,<2",          # type checking
    "codespell>=2.3,<3",        # typos in code, docstrings, and docs
    "deptry>=0.20,<1",          # dependency hygiene: unused / missing / transitive
]

# ── The reference linter preset ───────────────────────────────────────────────
# This is the canonical "how things are done" for every consumer of the shelf: a
# new project inherits THIS setup (resolution 0004 — a config-preset, not a CLI).
# Curated-broad on purpose: an explicit, grouped select reads as a reference far
# better than `ALL` minus a wall of ignores, and it does not silently break on a
# ruff upgrade that adds a rule. Every family below earns its place; every ignore
# below states why. Keep it legible — this file teaches the convention.
[tool.pyrefly]
preset = "strict"

[tool.pyrefly.errors]
deprecated = "error"
untyped-import = "error"
unnecessary-type-conversion = "error"
unannotated-return = "error"
no-any-return-explicit = "error"
no-any-return-implicit = "error"
unused-ignore = "error"
unused-type-ignore = "error"
unnecessary-comparison = "error"
missing-super-call = "error"
implicit-bool = false
unused-call-result = false

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-attribute = false
implicit-any-empty-container = false
unannotated-return = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"

